# Supabase CLI configuration for local development.
# Secrets are never stored here — real values live in .env.local and Vercel
# (ARCHITECTURE.md §11). Auth providers are configured in Phase 3.

project_id = "apexoria-content-copilot"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# DATABASE.md §2 — PostgreSQL 15+.
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback"]
