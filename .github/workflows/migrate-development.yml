name: Migrate shared Supabase (manual)

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply reviewed pending migrations to the shared live database (unchecked = dry run)
        type: boolean
        required: true
        default: false
      acknowledge_shared_target:
        description: I understand this Supabase project also serves the live site
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-development-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: supabase-development
    env:
      SUPABASE_PROJECT_REF: hkexglskvqaaeouvfdwm
    steps:
      - name: Require acknowledgement before hosted writes
        if: ${{ inputs.apply_migrations && !inputs.acknowledge_shared_target }}
        run: |
          echo "::error::Acknowledge the shared live database before applying migrations."
          exit 1

      - name: Require the default branch
        env:
          CURRENT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$CURRENT_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Run migrations only from the repository default branch."
            exit 1
          fi

      - name: Check out reviewed migrations
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.122.0

      - name: Link development project and preview migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "::error::Configure both Supabase secrets in the supabase-development environment."
            exit 1
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase migration list --linked
          supabase db push --linked --dry-run

      - name: Apply pending migrations
        if: ${{ inputs.apply_migrations }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --yes

      - name: Verify migrated development database
        if: ${{ inputs.apply_migrations }}
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: aws-0-ap-south-1.pooler.supabase.com
          PGPORT: "5432"
          PGDATABASE: postgres
          PGUSER: postgres.hkexglskvqaaeouvfdwm
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "15"
          PGOPTIONS: "-c statement_timeout=60000"
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          psql --no-psqlrc --set=ON_ERROR_STOP=1 \
            --command='\conninfo' --file=scripts/verify-database.sql

      - name: Show migration history after deployment
        if: ${{ inputs.apply_migrations }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked
